[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "saree-design-recognition"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy", "Pillow", "scikit-learn", "matplotlib"]
[project.scripts]
saree = "saree.cli:main"
[tool.setuptools.packages.find]
include = ["saree*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
